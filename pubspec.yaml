name: app_tareas
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.17.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Sistema de diseño Brainglab UI (lib/diseno/): tipografía y marca
  assets:
    - assets/marca/isotipo.png

  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fuentes/Montserrat-Regular.ttf
          weight: 400
        - asset: assets/fuentes/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fuentes/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fuentes/Montserrat-Bold.ttf
          weight: 700
        - asset: assets/fuentes/Montserrat-ExtraBold.ttf
          weight: 800
